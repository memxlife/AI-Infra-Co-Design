# @package _global_
optimizer:
  initial_guidance: configs/eve/optimizer/epfl_synthesis/initial_guidance
  workers:
    selection:
      _target_: scaling_evolve.algorithms.eve.workspace.worker_selection.RandomWorkerSelector
    items:
      - name: synthesis-recipe
        weight: 1.0
        immutable: configs/eve/optimizer/epfl_synthesis/immutable
        prompt: configs/eve/optimizer/epfl_synthesis/prompt
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.ScalarEloEvaluator
    k_factor: 32.0
    initial_score:
      elo: 1500.0
