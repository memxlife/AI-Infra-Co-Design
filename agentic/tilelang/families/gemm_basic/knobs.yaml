# Family gemm_basic: TileLang's examples/gemm/example_gemm.py with its integer knobs lifted to holes.
# kind int_menu = the solver's; structural = the agent's (changes what the program is). Each knob names the TileLang
# primitive it binds and the constraint it enters (the names are the contract's constraint ids).
family: gemm_basic
source: examples/gemm/example_gemm.py at the pinned commit (PINNED.md)
func: matmul
kernel: kernel.py.j2
knobs:
  - name: block_M
    kind: int_menu
    menu: [64, 128, 256]
    binds: "alloc_shared((block_M, block_K)), Kernel grid rows"
    enters: [smem, regs, divisibility, waves]
    meaning: rows of C per block
  - name: block_N
    kind: int_menu
    menu: [64, 128, 256]
    binds: "alloc_shared((block_K, block_N)), Kernel grid columns"
    enters: [smem, regs, divisibility, waves]
    meaning: columns of C per block
  - name: block_K
    kind: int_menu
    menu: [32, 64, 128]
    binds: "alloc_shared, Pipelined bound"
    enters: [smem, divisibility]
    meaning: slice of K per pipeline step
  - name: num_stages
    kind: int_menu
    menu: [2, 3, 4, 5]
    binds: "Pipelined(num_stages=)"
    enters: [smem]
    meaning: pipeline depth (tiles in flight)
  - name: threads
    kind: int_menu
    menu: [128, 256, 512]
    binds: "Kernel(threads=)"
    enters: [regs, threads]
    meaning: threads per block (TileLang adds a producer warp group on sm_121a)
  - name: swizzle
    kind: int_menu
    menu: [0, 4, 8, 16]
    binds: "use_swizzle(panel_size=)"
    enters: []
    meaning: thread-block traversal panel (0 = TileLang's default order; no use_swizzle line)
  # ---- round 2, Group A (integer menus, solver-owned). Each confirmed against the TileLang source at fe6d319c.
  - name: prefetch
    kind: int_menu
    menu: [0, 1, 2]
    binds: "Pipelined(order=[0,1,2], stage=[0,0,prefetch]) (tilelang/language/loop.py:112-117); 0 = TileLang's inferred schedule"
    enters: [pipeline]
    meaning: how many k-steps the copies run ahead of the multiply (0 = let TileLang decide)
    round: 2
  - name: warp_policy
    kind: int_menu
    menu: [0, 1, 2]
    binds: "gemm(policy=GemmWarpPolicy) (tilelang/language/gemm_op.py:160-166; tilelang/tileop/base.py:5: Square=0, FullRow=1, FullCol=2)"
    enters: []
    meaning: how the warps split the tile (square, all along rows, all along columns)
    round: 2
  - name: vec_width
    kind: int_menu
    menu: [0, 4, 8, 16]
    binds: "copy(coalesced_width=) (tilelang/language/copy_op.py:59-63); 0 = unset"
    enters: []
    meaning: elements per copy instruction
    round: 2
  # ---- round 2, Group B (switches, solver-owned)
  - name: tma
    kind: int_menu
    menu: [1, 0]
    binds: "tilelang.cuda.language.copy(disable_tma=True) per copy (tilelang/cuda/language/copy_op.py:24); the pass config tl.disable_tma_lower is deprecated at this commit (pass_config.py:378)"
    enters: []
    meaning: 1 = copies through TMA (what TileLang picks), 0 = cp.async
    round: 2
  - name: warp_spec
    kind: int_menu
    menu: [1, 0]
    binds: "tilelang.jit(pass_configs={'tl.disable_warp_specialized': True}) (tilelang/transform/pass_config.py:73)"
    enters: [regs]
    meaning: 1 = the 128-thread producer warp group, 0 = none (no T+128 register cliff)
    round: 2
  - name: smem_layout
    kind: menu
    menu: ["inferred", "swizzled"]
    binds: "annotate_layout({A_s: make_swizzled_layout}) (tilelang/language/annotations.py:45, tilelang/layout/swizzle.py:66); make_linear_layout (swizzle.py:129) is out of the menu since round 3: wrong answers with TMA (tile-ai/tilelang#3571), 1.1-2x slower on the cp.async path"
    enters: []
    meaning: the shared-memory layout of the A and B tiles
    round: 2
skinny_menus:   # when M < 64 the block_M menu is replaced by this one
  block_M: [16, 32, 64]
structural:
  - name: layout
    choice: [as inferred]
    binds: annotate_layout
    note: the agent's; not a hole in this family (TileLang's layout inference decides)
  - name: copy_lowering
    choice: [as inferred]
    binds: pass config
    note: on sm_121a TileLang lowers the copies to TMA by itself
